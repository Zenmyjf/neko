name: Build and Push to Docker Hub

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build base image (server + client + X server)
        run: ./build --repository docker.io/${{ secrets.DOCKERHUB_USERNAME }} --tag latest --yes --push

      - name: Build Firefox app image
        run: ./build --repository docker.io/${{ secrets.DOCKERHUB_USERNAME }} --application firefox --tag latest --yes --push
